<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>甲贺忍蛙大冒险</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#e8f4fd;color:#1a4a7a;font-size:20px}
  .app{max-width:1400px;margin:0 auto;background:linear-gradient(180deg,#e8f4fd 0%,#c8e8f8 100%);min-height:100vh;padding-bottom:40px}
  .topbar{display:flex;flex-direction:column;gap:14px;padding:18px 24px 20px;background:linear-gradient(135deg,#3a7bd5,#2b5fa3);color:#fff;box-shadow:0 4px 14px rgba(43,95,163,.2)}
  /* 问候行 */
  .greeting-row{width:100%;text-align:center}
  .greeting{font-size:28px;font-weight:bold;margin:0;letter-spacing:1px}
  .greeting .emoji{font-size:30px;margin-right:6px}
  .greeting-sub{font-size:16px;opacity:.92;margin-top:6px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
  .greeting-sub .encourage{font-style:italic}
  /* 统计卡片容器 */
  .stats-row{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
  .stat-card{background:#e8f4fd;color:#1a4a7a;padding:14px 28px;border-radius:18px;box-shadow:0 4px 10px rgba(0,0,0,.18),inset 0 -3px 0 rgba(43,95,163,.15);border:2px solid #c8e8f8;min-width:180px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
  .stat-card .stat-label{font-size:16px;font-weight:bold;color:#2b5fa3;display:flex;align-items:center;gap:4px}
  .stat-card .stat-value{font-family:"Courier New",monospace;font-size:38px;font-weight:bold;line-height:1.1;background:linear-gradient(180deg,#2a6fdb,#1a4a7a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 1px 0 rgba(255,255,255,.4);min-width:60px}
  .stat-card .stat-value.gold{background:linear-gradient(180deg,#ff8a00,#c97000);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .stat-card .stat-unit{font-size:14px;color:#5a8ab5;font-weight:bold}
  /* 三栏布局：左侧学科 | 中间任务(2/3) | 右侧宠物+商店(更宽) */
  .layout{display:grid;grid-template-columns:160px minmax(0,2fr) minmax(0,1.4fr);gap:16px;padding:16px}
  /* 左侧学科导航 */
  .subj{display:flex;flex-direction:column;gap:10px;padding:14px;background:#fff;border-radius:16px;box-shadow:0 4px 12px rgba(43,95,163,.12);position:sticky;top:14px;align-self:start}
  .subj-btn{padding:18px 8px;border:none;border-radius:14px;background:#eef6ff;color:#2b5fa3;font-size:20px;font-weight:bold;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:.2s}
  .subj-btn.active{background:linear-gradient(135deg,#3a7bd5,#2b5fa3);color:#fff;box-shadow:0 3px 8px rgba(43,95,163,.3)}
  .subj-btn .icon{font-size:32px}
  .subj-btn .text{font-size:18px}
  /* 中间任务区 */
  .tasks h2{margin:4px 4px 12px;font-size:26px;color:#1a4a7a;display:flex;align-items:center;gap:6px}
  .progress{background:#fff;padding:10px 16px;border-radius:10px;margin-bottom:10px;font-size:18px;color:#2b5fa3}
  .progress .pct{float:right;color:#3a7bd5;font-weight:bold;font-size:20px}
  .task{background:#fff;border-radius:14px;padding:14px 18px;margin-bottom:8px;box-shadow:0 2px 6px rgba(43,95,163,.08)}
  .taskgroup{margin-bottom:12px}
  .tg-head{font-size:20px;font-weight:bold;color:#2b5fa3;margin:8px 4px;padding-left:10px;border-left:4px solid #3a7bd5}
  .task .head{display:none}
  .item{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:20px;border-bottom:1px solid #eef6ff}
  .item:last-child{border-bottom:none}
  .item input[type=checkbox]{width:28px;height:28px;accent-color:#3a7bd5;cursor:pointer;flex-shrink:0}
  .item .label{flex:1;color:#1a4a7a}
  .item.done .label{text-decoration:line-through;color:#9ab8d5}
  .item .reward{background:#ffe6a8;color:#8a6500;padding:4px 12px;border-radius:10px;font-size:15px;font-weight:bold;white-space:nowrap}
  .item .link{background:#d0e8ff;color:#2b5fa3;padding:5px 14px;border-radius:10px;font-size:14px;border:none;cursor:pointer;text-decoration:none;white-space:nowrap}
  /* 右侧宠物+商店：两张独立卡片纵向排列 */
  .side{position:sticky;top:14px;align-self:start;max-height:calc(100vh - 28px);overflow-y:auto;-webkit-overflow-scrolling:touch}
  .side::-webkit-scrollbar{width:4px}
  .side::-webkit-scrollbar-thumb{background:#b0d0f0;border-radius:2px}
  .pet-card{background:#fff;border-radius:14px;padding:14px;text-align:center;box-shadow:0 3px 8px rgba(43,95,163,.08);margin-bottom:12px}
  .pet-card .avatar{font-size:80px;line-height:1;filter:drop-shadow(0 2px 4px rgba(255,200,0,.4))}
  .pet-card .name{font-weight:bold;color:#1a4a7a;margin-top:6px;font-size:22px;display:block}
  .pet-card .level{display:inline-block;background:#ffd84d;color:#8a6500;padding:2px 10px;border-radius:10px;font-size:14px;margin-left:4px}
  .pet-card .status{font-size:15px;color:#5a8ab5;margin-top:6px;display:block}
  .pet-card .bar{height:8px;background:#eef6ff;border-radius:4px;margin:5px 6px;overflow:hidden}
  .pet-card .bar i{display:block;height:100%;border-radius:4px;transition:width .4s}
  .pet-card .bar.hunger i{background:linear-gradient(90deg,#ffb56b,#ff7e5f)}
  .pet-card .bar.mood i{background:linear-gradient(90deg,#ffd84d,#ffb800)}
  .pet-card .bar.power i{background:linear-gradient(90deg,#5a9cef,#2b5fa3)}
  .pet-card .bubble{background:#fff4d0;border-radius:10px;padding:10px;font-size:15px;color:#1a4a7a;margin-top:8px;line-height:1.5;border:1px solid #ffe6a8;display:block}
  /* 商店：独立卡片，不再内部滚动 */
  .shop{background:#fff;border-radius:14px;padding:12px;box-shadow:0 3px 8px rgba(43,95,163,.08)}
  .shop h3{margin:0 0 8px;font-size:18px;color:#1a4a7a;display:flex;align-items:center;gap:6px}
  .shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .good{background:#eef6ff;border-radius:12px;padding:10px;text-align:center;cursor:pointer;transition:.2s}
  .good:active{transform:scale(.95)}
  .good .emoji{font-size:38px}
  .good .gname{font-size:15px;color:#1a4a7a;margin-top:4px}
  .good .gprice{font-size:15px;color:#8a6500;font-weight:bold}
  .good.disabled{opacity:.4;pointer-events:none}
  .modal{position:fixed;inset:0;background:rgba(20,50,90,.5);display:none;align-items:center;justify-content:center;z-index:99}
  .modal.show{display:flex}
  .modal-box{background:#fff;border-radius:18px;padding:24px;width:80%;max-width:340px;text-align:center}
  .modal-box .m-emoji{font-size:72px}
  .modal-box .m-msg{font-size:18px;color:#1a4a7a;margin:14px 0;line-height:1.6}
  .modal-box button{background:linear-gradient(135deg,#3a7bd5,#2b5fa3);color:#fff;border:none;padding:12px 32px;border-radius:20px;font-size:18px;font-weight:bold;cursor:pointer}
  .reset-btn{display:block;margin:8px 0;padding:10px;border:1px dashed #7ab0e0;background:transparent;color:#5a8ab5;border-radius:12px;font-size:16px;width:100%;cursor:pointer}
  /* 手机竖屏：单列 */
  @media (max-width:600px){
    .app{max-width:480px}
    body{font-size:18px}
    .layout{grid-template-columns:1fr;gap:10px;padding:10px}
    .subj{flex-direction:row;flex-wrap:wrap;position:static}
    .subj-btn{flex:1 1 30%;flex-direction:row;font-size:18px;padding:10px 6px}
    .subj-btn .icon{font-size:24px}
    .subj-btn .text{font-size:16px}
    .side{position:static;max-height:none;overflow:visible}
    .pet-card .avatar{font-size:88px}
  }
  /* iPad竖版：两栏（学科窄 + 任务宽 + 侧栏单列放在底部） */
  @media (min-width:601px) and (max-width:900px){
    .layout{grid-template-columns:130px 1fr;gap:12px}
    .side{grid-column:1/3;position:static;max-height:none;overflow:visible;display:grid;grid-template-columns:1fr 1.4fr;gap:12px;align-items:start}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="greeting-row">
      <h1 class="greeting"><span class="emoji" id="greetEmoji">🌅</span><span id="greetText">早上好呀~</span></h1>
      <div class="greeting-sub">
        <span id="dateText">📅 2026年8月1日 周六</span>
        <span class="encourage">💭 <span id="encourageText">水跃闪亮，准备好特训啦！</span></span>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">📅 已打卡</div>
        <div class="stat-value" id="streakDays">0</div>
        <div class="stat-unit">天</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">⭐ 累计星星</div>
        <div class="stat-value gold" id="points">0</div>
        <div class="stat-unit">颗</div>
      </div>
    </div>
  </div>
  <div class="layout">
    <div class="subj" id="subjects"></div>
    <div class="tasks">
      <h2 id="subjTitle"></h2>
      <div class="progress">今日完成 <b id="doneCount">0</b>/<span id="totalCount">0</span> 项<span class="pct" id="pctText">0%</span></div>
      <div class="progress" style="font-size:12px;color:#5a8ab5">累计完成 <b id="totalDone">0</b> 项任务</div>
      <div id="taskList"></div>
      <button class="reset-btn" id="resetTodayBtn" onclick="resetToday()">🔄 重置今日打卡（长按清空全部）</button>
      <div style="display:flex;gap:10px;margin-top:8px">
        <button class="reset-btn" style="width:auto;flex:1;margin:0" onclick="exportData()">📤 导出备份</button>
        <button class="reset-btn" style="width:auto;flex:1;margin:0" onclick="document.getElementById('importFile').click()">📥 导入恢复</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      </div>
    </div>
    <div class="side">
      <div class="pet-card">
        <div class="avatar" id="petAvatar">🥷</div>
        <div class="name" id="petName">甲贺忍蛙</div><span class="level" id="petLevel">Lv.1</span>
        <div class="status" id="petStatus">饱食 50 · 心情 80 · 战力 10</div>
        <div class="bar hunger"><i id="hungerBar" style="width:50%"></i></div>
        <div class="bar mood"><i id="moodBar" style="width:80%"></i></div>
        <div class="bar power"><i id="powerBar" style="width:10%"></i></div>
        <div class="bubble" id="petBubble">小训练师加油！累计完成 0 项任务，再完成 5 项就升级啦！</div>
      </div>
      <div class="shop">
        <h3>🏪 道具商店</h3>
        <div class="shop-grid" id="shopGrid">
          <div class="good"><div class="emoji">🍬</div><div class="gname">宝可方块</div><div class="gprice">⭐6</div></div>
          <div class="good"><div class="emoji">🍎</div><div class="gname">树果</div><div class="gprice">⭐4</div></div>
          <div class="good"><div class="emoji">🧃</div><div class="gname">能量饮料</div><div class="gprice">⭐8</div></div>
          <div class="good"><div class="emoji">🍱</div><div class="gname">营养便当</div><div class="gprice">⭐10</div></div>
          <div class="good"><div class="emoji">🔴</div><div class="gname">精灵球</div><div class="gprice">⭐10</div></div>
          <div class="good"><div class="emoji">🎮</div><div class="gname">宝可梦玩具</div><div class="gprice">⭐6</div></div>
          <div class="good"><div class="emoji">🌟</div><div class="gname">经验糖果</div><div class="gprice">⭐12</div></div>
          <div class="good"><div class="emoji">🎵</div><div class="gname">音乐盒</div><div class="gprice">⭐8</div></div>
          <div class="good"><div class="emoji">💧</div><div class="gname">水手里剑</div><div class="gprice">⭐15</div></div>
          <div class="good"><div class="emoji">📜</div><div class="gname">忍术卷轴</div><div class="gprice">⭐20</div></div>
          <div class="good"><div class="emoji">🔰</div><div class="gname">战斗护符</div><div class="gprice">⭐18</div></div>
          <div class="good"><div class="emoji">⚗️</div><div class="gname">神秘药水</div><div class="gprice">⭐25</div></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="m-emoji" id="mEmoji">🎉</div>
    <div class="m-msg" id="mMsg"></div>
    <button onclick="closeModal()">好的</button>
  </div>
</div>
<script>
/* =====================================================================
   ★★★ 配置区：只改这里！ ★★★
   ===================================================================== */

const CONFIG = {

  appTitle: '甲贺忍蛙大冒险',
  childName: '小训练师',

  /* 学科 + 任务 */
  subjects: [
    {
      id: 'chinese', icon: '📖', name: '语文',
      tasks: [
        { name: '朗读', reward: 2 },
        { name: '阅读', reward: 2 },
        { name: '拼音', reward: 2 },
        { name: '摩比爱语文', reward: 3, link: '' },
        { name: '写字', reward: 2 }
      ]
    },
    {
      id: 'math', icon: '🔢', name: '数学',
      tasks: [
        { name: '高思', reward: 3, link: '' },
        { name: '计算', reward: 2 }
      ]
    },
    {
      id: 'english', icon: '🔤', name: '英语',
      tasks: [
        { name: 'Power up', reward: 3, link: '' },
        { name: 'Raz', reward: 2, link: '' },
        { name: '背单词', reward: 2 },
        { name: '阅读', reward: 2 },
        { name: 'Grammar', reward: 3 },
        { name: '剑一', reward: 4 }
      ]
    },
    {
      id: 'sport', icon: '⚽', name: '运动',
      tasks: [
        { name: '户外运动', reward: 3 },
        { name: '室内运动', reward: 2 }
      ]
    },
    {
      id: 'piano', icon: '🎹', name: '钢琴',
      tasks: [
        { name: '今日练琴打卡', reward: 3 }
      ]
    }
  ],

  /* 商店：food 加饱食度，toy 加心情，power 加战斗力 */
  shop: [
    { id:'f1', name:'宝可方块',  emoji:'🍬', price:6,  type:'food' },
    { id:'f2', name:'树果',      emoji:'🍎', price:4,  type:'food' },
    { id:'f3', name:'能量饮料',  emoji:'🧃', price:8,  type:'food' },
    { id:'f4', name:'营养便当',  emoji:'🍱', price:10, type:'food' },
    { id:'t1', name:'精灵球',    emoji:'🔴', price:10, type:'toy'  },
    { id:'t2', name:'宝可梦玩具',emoji:'🎮', price:6,  type:'toy'  },
    { id:'t3', name:'经验糖果',  emoji:'🌟', price:12, type:'toy'  },
    { id:'t4', name:'音乐盒',    emoji:'🎵', price:8,  type:'toy'  },
    { id:'p1', name:'水手里剑',  emoji:'💧', price:15, type:'power' },
    { id:'p2', name:'忍术卷轴',  emoji:'📜', price:20, type:'power' },
    { id:'p3', name:'战斗护符',  emoji:'🔰', price:18, type:'power' },
    { id:'p4', name:'神秘药水',  emoji:'⚗️', price:25, type:'power' }
  ],

  /* 宠物（宝可梦：甲贺忍蛙） */
  pet: {
    name: '甲贺忍蛙',
    avatar: '🥷',
    hungry: 50,
    mood: 80,
    power: 10
  }
};

/* ============ 配置区结束 ============ */

let state, currentSub;
const $ = id => document.getElementById(id);
const SAVE_KEY = 'kids_study_desk_v3';
const PERM_KEY = 'kids_study_desk_permanent'; // 永久数据（跨天保留）

function load(){
  // 1. 加载永久数据
  let perm;
  try{
    perm = JSON.parse(localStorage.getItem(PERM_KEY)) || {};
  }catch(e){ perm = {}; }
  if(!perm.pet) perm.pet = { ...CONFIG.pet };
  if(perm.totalDone === undefined) perm.totalDone = 0;
  if(perm.totalStars === undefined) perm.totalStars = 18; // 初始赠送 18 颗星星
  if(!perm.checkDates){
    // 初始已打卡 1 天（今天）
    perm.checkDates = [todayStr()];
  }

  // 2. 加载今日打卡状态
  let today;
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s && s.date === todayStr()) today = s;
  }catch(e){}
  if(!today) today = { date: todayStr(), done: {} };

  // 3. 合并：星星用累计数，打卡用今日状态
  return {
    date: today.date,
    points: perm.totalStars,        // 星星=累计星星，不每日重置
    done: today.done,
    pet: perm.pet,
    totalDone: perm.totalDone,
    totalStars: perm.totalStars,
    checkDates: perm.checkDates
  };
}

function save(){
  // 保存今日打卡状态
  localStorage.setItem(SAVE_KEY, JSON.stringify({
    date: state.date,
    done: state.done
  }));
  // 保存永久数据（星星=累计星星）
  localStorage.setItem(PERM_KEY, JSON.stringify({
    pet: state.pet,
    totalDone: state.totalDone,
    totalStars: state.totalStars,
    checkDates: state.checkDates
  }));
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}

function renderSubjects(){
  $('subjects').innerHTML = CONFIG.subjects.map((s,i)=>
    `<button class="subj-btn ${i===0?'active':''}" data-idx="${i}" onclick="switchSub(${i})"><span class="icon">${s.icon}</span><span class="text">${s.name}</span></button>`
  ).join('');
  $('appTitle').textContent = CONFIG.appTitle;
}

function switchSub(idx){
  currentSub = idx;
  document.querySelectorAll('.subj-btn').forEach((b,i)=>b.classList.toggle('active', i===idx));
  renderTasks();
}

function renderTasks(){
  const sub = CONFIG.subjects[currentSub];
  $('subjTitle').textContent = sub.icon + ' ' + sub.name;
  let html = '';
  let idx = 0;
  const groups = sub.groups || [{ name: sub.name, tasks: sub.tasks }];
  groups.forEach(g => {
    html += `<div class="taskgroup"><div class="tg-head">${g.name}</div>`;
    g.tasks.forEach(t => {
      const key = sub.id+'-'+idx;
      const done = state.done[key];
      html += `<div class="task">
        <div class="head"><span class="num">${idx+1}</span></div>
        <div class="item ${done?'done':''}">
          <input type="checkbox" ${done?'checked':''} onchange="toggle('${sub.id}',${idx},this)">
          <span class="label">${t.name}</span>
          ${t.link?`<a class="link" href="${t.link}" target="_blank">打开</a>`:''}
          <span class="reward">+${t.reward}</span>
        </div>
      </div>`;
      idx++;
    });
    html += '</div>';
  });
  $('taskList').innerHTML = html;
  const total = idx;
  const done = Object.keys(state.done).filter(k => k.startsWith(sub.id+'-')).length;
  $('doneCount').textContent = done;
  $('totalCount').textContent = total;
  $('pctText').textContent = total ? Math.round(done/total*100)+'%' : '0%';
}

function renderShop(){
  $('shopGrid').innerHTML = CONFIG.shop.map(g=>`
    <div class="good ${state.points<g.price?'disabled':''}" onclick="buy('${g.id}')">
      <div class="emoji">${g.emoji}</div>
      <div class="gname">${g.name}</div>
      <div class="gprice">⭐${g.price}</div>
    </div>
  `).join('');
}

function renderPet(){
  $('petName').textContent = state.pet.name;
  $('petAvatar').textContent = state.pet.avatar;
  const exp = state.totalDone || 0;
  const level = Math.floor(exp/5)+1;
  $('petLevel').textContent = 'Lv.'+level;
  $('petStatus').textContent = `饱食 ${state.pet.hungry} · 心情 ${state.pet.mood} · 战力 ${state.pet.power||10}`;
  $('hungerBar').style.width = state.pet.hungry+'%';
  $('moodBar').style.width = state.pet.mood+'%';
  $('powerBar').style.width = (state.pet.power||10)+'%';
  let txt;
  if(state.pet.hungry < 30) txt = `忍术再强也撑不住饥饿……快去商店买点树果补给吧！`;
  else if(state.pet.mood < 40) txt = `状态不佳……买点道具陪我特训一下吧！`;
  else if(state.pet.hungry > 80 && state.pet.mood > 80) txt = `水手里剑准备就绪！今天战斗力满分，感谢${CONFIG.childName}！`;
  else txt = `${CONFIG.childName}加油！累计完成 ${exp} 项任务，再完成 ${5-exp%5} 项就升级啦！`;
  $('petBubble').textContent = txt;
}

function renderAll(){
  try{ renderTasks(); }catch(e){ console.error('renderTasks:',e); }
  try{ renderShop(); }catch(e){ console.error('renderShop:',e); }
  try{ renderPet(); }catch(e){ console.error('renderPet:',e); }
  try{ $('points').textContent = state.points; }catch(e){}
  try{ $('totalDone').textContent = state.totalDone||0; }catch(e){}
  try{ updateStreak(); }catch(e){ console.error('updateStreak:',e); }
}

/* 累计打卡天数：所有打卡的日期总数（不去重连续） */
function calcStreak(){
  if(!state.checkDates) return 0;
  return state.checkDates.length;
}

function updateStreak(){
  $('streakDays').textContent = calcStreak();
}

/* 顶栏问候语 + 鼓励语 */
function getGreeting(){
  const h = new Date().getHours();
  if(h >= 5 && h < 11) return { emoji:'🌅', text:'早上好呀~' };
  if(h >= 11 && h < 14) return { emoji:'🌞', text:'中午好呀~' };
  if(h >= 14 && h < 18) return { emoji:'☀️', text:'下午好呀~' };
  if(h >= 18 && h < 22) return { emoji:'🌙', text:'晚上好呀~' };
  return { emoji:'🌜', text:'夜深啦~' };
}

const ENCOURAGES = [
  '水跃闪亮，准备好特训啦！',
  '今天的目标，就决定是你了！',
  '路卡利欧说：剑与盾都需要练习呀~',
  '忍蛙陪${name}一起冲刺吧！',
  '皮神在隔壁喊加油呢~',
  '今天的训练会变成明天的实力！',
  '小训练师，出击吧！',
  '甲贺忍蛙的飞水手里剑已经上膛！',
  '每完成一项，战斗力就提升一点！',
  '杰尼龟也在等你超越它哦~',
  '谁说咸鱼不能翻身？我们要进化！',
  '今天的你，比昨天更强一点！',
  '妙蛙种子会用阳光为你加持！',
  '伊布说：再坚持一下就能进化啦！',
  '波克比为你撒下幸运星 ✨',
  '闹钟已经响了，宝可梦们都在等你！'
];

function updateGreeting(){
  const g = getGreeting();
  $('greetEmoji').textContent = g.emoji;
  $('greetText').textContent = g.text;
  // 鼓励语取随机 + 持久化，让同一会话不重复
  if(!state._encourageIdx) state._encourageIdx = Math.floor(Math.random()*ENCOURAGES.length);
  $('encourageText').textContent = ENCOURAGES[state._encourageIdx].replace('${name}', CONFIG.childName);
}

function updateDateText(){
  const d = new Date();
  const week = ['日','一','二','三','四','五','六'][d.getDay()];
  $('dateText').textContent = `📅 ${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 周${week}`;
}

function toggle(subId, idx, el){
  const sub = CONFIG.subjects.find(s=>s.id===subId);
  const t = (sub.tasks || (sub.groups||[]).flatMap(g=>g.tasks))[idx];
  const key = subId+'-'+idx;
  if(state.done[key]){
    delete state.done[key];
    state.points = Math.max(0, state.points - t.reward);
    state.totalStars = Math.max(0, (state.totalStars||0) - t.reward);
  }else{
    state.done[key] = true;
    state.points += t.reward;
    state.totalStars = (state.totalStars||0) + t.reward;
    state.pet.mood = Math.min(100, state.pet.mood + 2);
    state.pet.power = Math.min(100, (state.pet.power||10) + 1);
    state.totalDone = (state.totalDone||0) + 1;
    // 记录今日打卡（用于连续天数统计）
    const today = todayStr();
    if(!state.checkDates.includes(today)){
      state.checkDates.push(today);
      // 只保留最近90天，避免无限增长
      if(state.checkDates.length > 90) state.checkDates = state.checkDates.slice(-90);
    }
    const praises = ['干得漂亮！','水手里剑命中！','忍术升级！','特训完成！','战斗力提升！'];
    // 检查是否升级
    const oldLevel = Math.floor((state.totalDone-1)/5)+1;
    const newLevel = Math.floor(state.totalDone/5)+1;
    let levelMsg = '';
    if(newLevel > oldLevel){
      levelMsg = `<br><br>🎊 <b>甲贺忍蛙升级了！</b><br>Lv.${oldLevel} → Lv.${newLevel}`;
    }
    showModal('🥷', `${praises[Math.floor(Math.random()*praises.length)]}<br>+${t.reward} 星星（累计 ${state.totalStars}）${levelMsg}`);
  }
  save();
  el.parentElement.classList.toggle('done', !!state.done[key]);
  el.checked = !!state.done[key];
  const total = Object.keys(state.done).filter(k=>k.startsWith(subId+'-')).length;
  const subTotal = (sub.tasks || (sub.groups||[]).flatMap(g=>g.tasks)).length;
  $('doneCount').textContent = total;
  $('pctText').textContent = subTotal ? Math.round(total/subTotal*100)+'%' : '0%';
  $('points').textContent = state.points;
  renderShop();
  renderPet();
}

function buy(id){
  const g = CONFIG.shop.find(x=>x.id===id);
  if(state.points < g.price){ showModal('😅','星星不够哦～继续完成任务吧！'); return; }
  state.points -= g.price;
  let effect = '';
  if(g.type==='food'){
    state.pet.hungry = Math.min(100, state.pet.hungry + 20);
    effect = '饱食度 +20';
  } else if(g.type==='toy'){
    state.pet.mood = Math.min(100, state.pet.mood + 15);
    effect = '心情 +15';
  } else if(g.type==='power'){
    state.pet.power = Math.min(100, (state.pet.power||10) + 15);
    effect = '战斗力 +15';
  }
  save();
  showModal(g.emoji, `买到【${g.name}】啦！<br>${effect}`);
  renderAll();
}

function resetToday(){
  // 只重置今日打卡状态，星星和宠物等级都保留
  state.date = todayStr();
  state.done = {};
  save();
  renderAll();
  showModal('🔄','新的一天开始啦！<br>星星和宠物等级都已保留～');
}

/* 导出备份 */
function exportData(){
  const data = {
    date: state.date,
    done: state.done,
    pet: state.pet,
    totalDone: state.totalDone || 0,
    totalStars: state.totalStars || 0,
    exportTime: new Date().toLocaleString('zh-CN')
  };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `学习冒险岛备份_${state.date}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showModal('📤', `备份成功！<br>已保存为 JSON 文件<br>请保存到合适的位置`);
}

/* 导入恢复 */
function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(data.pet) state.pet = data.pet;
      if(data.done) state.done = data.done;
      if(data.totalDone !== undefined) state.totalDone = data.totalDone;
      if(data.totalStars !== undefined){
        state.totalStars = data.totalStars;
        state.points = data.totalStars;
      }
      if(data.date) state.date = data.date;
      save();
      renderAll();
      showModal('📥', `恢复成功！<br>宠物：${state.pet.name} Lv.${Math.floor((state.totalDone||0)/5)+1}<br>累计星星：${state.totalStars||0}<br>累计任务：${state.totalDone||0}`);
    }catch(err){
      showModal('❌', '导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
  event.target.value = ''; // 重置input，方便再次导入
}

let resetTimer;
document.getElementById('resetTodayBtn').addEventListener('touchstart',()=>{
  resetTimer = setTimeout(()=>{
    localStorage.removeItem(SAVE_KEY);
    localStorage.removeItem(PERM_KEY);
    state = load();
    renderAll();
    showModal('🗑️','已清空所有记录（含宠物等级）');
  }, 1500);
});
document.getElementById('resetTodayBtn').addEventListener('touchend',()=>clearTimeout(resetTimer));

function showModal(emoji, msg){ $('mEmoji').textContent=emoji; $('mMsg').innerHTML=msg; $('modal').classList.add('show'); }
function closeModal(){ $('modal').classList.remove('show'); }

let petPress;
$('petAvatar').addEventListener('touchstart',()=>{
  petPress = setTimeout(()=>{
    const n = prompt('给宝可梦改个名字：', state.pet.name);
    if(n){ state.pet.name = n.slice(0,8); save(); renderPet(); }
  }, 600);
});
$('petAvatar').addEventListener('touchend',()=>clearTimeout(petPress));

/* 启动 */
state = load();
currentSub = 0;
renderSubjects();
renderAll();
updateGreeting();
updateDateText();
</script>
